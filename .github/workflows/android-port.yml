name: Android ARM64 APK
on:
  push:
    branches: [develop, "port/**"]
    paths: ["android/**", "linux/ui/**", "src/**", "scripts/*android*", "scripts/prepare_linux*", "linux/*dependencies*", "tools/chiaki_switch/**", ".github/workflows/android-port.yml"]
  pull_request:
    paths: ["android/**", "linux/ui/**", "src/**", "scripts/*android*", ".github/workflows/android-port.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to attach artifacts to
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      PKG_CONFIG_LIBDIR: ${{ github.workspace }}/build/android-prefix/lib/pkgconfig
      PKG_CONFIG_PATH: ""
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CCACHE_DIR: ${{ github.workspace }}/build/android-ccache
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ make pkg-config protobuf-compiler python3-protobuf perl nasm ccache
          sdkmanager "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
      - uses: actions/cache/restore@v4
        id: android-cache
        with:
          path: |
            lib/libpeer
            lib/borealis
            lib/chiaki-native
            lib/android-sources
            build/android-prefix
            build/android-deps
            build/android-ccache
          key: android-arm64-v1-${{ hashFiles('android/dependencies.lock.json', 'linux/*dependencies.lock.json', 'scripts/build_android_dependencies.sh', 'tools/libpeer_legacy/**', 'tools/chiaki_switch/*.patch') }}-${{ github.run_id }}
          restore-keys: android-arm64-v1-${{ hashFiles('android/dependencies.lock.json', 'linux/*dependencies.lock.json', 'scripts/build_android_dependencies.sh', 'tools/libpeer_legacy/**', 'tools/chiaki_switch/*.patch') }}-
      - name: Prepare pinned source archives
        run: |
          test -f lib/libpeer/LINUX_PROVENANCE.json || python3 scripts/prepare_linux_dependencies.py
          test -f lib/borealis/LINUX_PROVENANCE.json || python3 scripts/prepare_linux_ui.py
          test -f lib/chiaki-native/LINUX_PROVENANCE.json || python3 scripts/prepare_linux_chiaki.py
          python3 scripts/prepare_android_dependencies.py --reuse-prepared
      - name: Cross-compile ARM64 dependencies
        run: bash scripts/build_android_dependencies.sh
      - name: Configure stable development signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "No signing secrets (fork or unconfigured); using Gradle's debug key."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/lunarnx-dev.p12"
          echo "LUNARNX_KEYSTORE_PATH=$RUNNER_TEMP/lunarnx-dev.p12" >> "$GITHUB_ENV"
          echo "LUNARNX_KEYSTORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n ')" >> "$GITHUB_ENV"
      - name: Assemble installable development APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Check package and signature
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk
          python3 tests/android_apk_contract.py android/app/build/outputs/apk/debug/app-debug.apk
          python3 tests/android_jni_contract.py android/app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
          git diff --check HEAD^ HEAD
          mkdir -p build/packages
          cp android/app/build/outputs/apk/debug/app-debug.apk build/packages/LunarNX-Android-arm64-debug.apk
          python3 scripts/archive_port_sources.py build/packages/LunarNX-Android-corresponding-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: LunarNX-Android-ARM64-APK
          path: |
            build/packages/LunarNX-Android-arm64-debug.apk
            build/packages/LunarNX-Android-corresponding-source.tar.gz
            lib/android-sources/ANDROID_PROVENANCE.json
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cp build/packages/LunarNX-Android-arm64-debug.apk build/packages/LunarNX.apk
          gh release upload "$RELEASE_TAG" build/packages/LunarNX.apk build/packages/LunarNX-Android-corresponding-source.tar.gz --clobber
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            lib/libpeer
            lib/borealis
            lib/chiaki-native
            lib/android-sources
            build/android-prefix
            build/android-deps
            build/android-ccache
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
