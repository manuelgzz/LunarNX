name: Linux port foundation
on:
  push:
    branches: [main, "port/**"]
    paths:
      - "Makefile.linux"
      - "linux/**"
      - "scripts/*linux*"
      - "tools/mock_xbox/**"
      - "tests/portable/**"
      - "tests/*_test.cpp"
      - "src/**"
      - ".github/workflows/linux-port.yml"
  pull_request:
    paths:
      - "Makefile.linux"
      - "tests/portable/**"
      - "tests/*_test.cpp"
      - "src/**"
      - ".github/workflows/linux-port.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Configure shared policy tests
        run: cmake -S tests/portable -B build/portable -DCMAKE_BUILD_TYPE=Release
      - name: Compile shared policy tests
        run: cmake --build build/portable --parallel 2
      - name: Run shared policy tests
        run: ctest --test-dir build/portable --output-on-failure
      - name: Verify Linux toolchain flags
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsdl2-dev libavcodec-dev libavutil-dev libswresample-dev libopus-dev libcurl4-openssl-dev libssl-dev
          make -f Makefile.linux linux-toolchain-report > /tmp/linux-build.txt
          python3 - <<'PY'
          from pathlib import Path
          commands = Path("/tmp/linux-build.txt").read_text()
          forbidden = ("xcrun", "-isysroot", "/opt/homebrew", "-framework", 'CONFIG_IFACE_PREFIX=\\"en0')
          for flag in forbidden:
              assert flag not in commands, f"Apple-specific flag leaked into Linux: {flag}"
          assert "build/linux/LunarNX_Desktop" in commands
          PY
  native-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install native development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make pkg-config libsdl2-dev libavcodec-dev libavutil-dev libswresample-dev libopus-dev libcurl4-openssl-dev libssl-dev libavformat-dev ffmpeg xvfb xauth libgl1-mesa-dri
      - name: Prepare pinned dependency archives
        run: python3 scripts/prepare_linux_dependencies.py
      - name: Build native transport dependencies
        run: bash scripts/build_linux_dependencies.sh
      - name: Build complete native runner
        run: make -f Makefile.linux -j2 all linux-native-smoke linux-mock-stream
      - name: Decode and present synthetic video and audio
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=60 -frames:v 8 -c:v libx264 -preset ultrafast -tune zerolatency -g 1 -pix_fmt yuv420p -f h264 /tmp/fixture.h264
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=60 -frames:v 8 -c:v libx265 -preset ultrafast -x265-params pools=1:frame-threads=1:keyint=1:log-level=error -pix_fmt yuv420p -f hevc /tmp/fixture.hevc
          xvfb-run -a build/linux/linux_native_smoke /tmp/fixture.h264 /tmp/fixture.hevc
      - name: Stream from the local Xbox mock
        run: |
          python3 -m venv build/mock-venv
          build/mock-venv/bin/pip install aiortc==1.14.0 aiohttp==3.13.2
          build/mock-venv/bin/python tools/mock_xbox/test_protocol_shapes.py
          build/mock-venv/bin/python scripts/linux_mock_smoke.py
      - name: Focused transport regressions
        run: |
          python3 tests/xbox_stream_session_order_test.py
          python3 tests/libpeer_sctp_config_test.py
          python3 tests/libpeer_dtls_read_loop_test.py
          python3 tests/datachannel_ppid_test.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LunarNX-Linux-native-test-runner
          path: |
            build/linux/LunarNX_Desktop
            lib/libpeer/LINUX_PROVENANCE.json
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
