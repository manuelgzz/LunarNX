plugins { id 'com.android.application' }

android {
    namespace 'org.lunarnx.app'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.lunarnx.app'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.1-android-startup-fix'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release',
                    '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache',
                    '-DCMAKE_JOB_POOLS=compile=2', '-DCMAKE_JOB_POOL_COMPILE=compile'
                targets 'main'
            }
        }
    }
    sourceSets {
        main {
            java.srcDirs += 'generated/java'
            assets.srcDirs += 'generated/assets'
        }
    }
    externalNativeBuild {
        cmake {
            path '../../linux/ui/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging false } }
}
